name: One-use sealed secret transfer
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: one-use-sealed-secret-transfer
  cancel-in-progress: false
jobs:
  toolbar:
    name: Seal toolbar
    if: >-
      github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' &&
      github.ref_protected && github.run_attempt == 1 &&
      github.repository == 'bentbrain/feedback-toolbar' &&
      github.repository_id == '1418167129' &&
      github.repository_owner_id == '28818884' && github.actor_id == '28818884'
    environment: production
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.18.0'
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.4.4'
      - name: Install only the pinned sealing implementation
        working-directory: .github/secret-transfer
        run: bun install --ignore-scripts --frozen-lockfile
      - name: Seal fixed secret allowlist to reviewed target keys
        working-directory: .github/secret-transfer
        env:
          GH_TOKEN: ${{ github.token }}
          TRANSFER_SECRET_AUTH_GITHUB_CLIENT_SECRET: ${{ secrets.AUTH_GITHUB_CLIENT_SECRET }}
          TRANSFER_SECRET_BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          TRANSFER_SECRET_CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TRANSFER_SECRET_FEEDBACK_PROXY_SECRET: ${{ secrets.FEEDBACK_PROXY_SECRET }}
          TRANSFER_SECRET_VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: bun seal.ts toolbar
      - name: Upload ciphertext only
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: sealed-transfer-toolbar-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/sealed-secret-transfer/toolbar/sealed-transfer.json
          if-no-files-found: error
          include-hidden-files: false
          retention-days: 1
          compression-level: 0
